<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Evidence layers for the Temporal Cellular Phenotype Engine</title>
  <desc id="desc">Three separate CTC experiments: reference-centroid association F1 near 0.99; a supervised image-derived holdout with low segmentation, detection and link F1; and an exploratory Cellpose pilot on only eight early frames with higher image-derived metrics. The protocols are not directly comparable and none validates biological phenotype labels.</desc>
  <rect width="1200" height="760" rx="24" fill="#f5f7fb"/>
  <text x="52" y="62" fill="#10233f" font-family="Arial, sans-serif" font-size="30" font-weight="700">Evidence layers — kept separate</text>
  <text x="52" y="96" fill="#52647a" font-family="Arial, sans-serif" font-size="16">DIC-C2DH-HeLa · all bars use a 0–1 F1 scale; each panel is a different evaluation protocol</text>

  <g font-family="Arial, sans-serif">
    <rect x="42" y="128" width="356" height="510" rx="18" fill="#ffffff" stroke="#d9e1ec"/>
    <text x="64" y="166" fill="#163b66" font-size="18" font-weight="700">Reference-centroid association</text>
    <text x="64" y="192" fill="#66768a" font-size="13">CTC reference centroids isolate tracking</text>
    <text x="64" y="210" fill="#66768a" font-size="13">association from image segmentation.</text>
    <text x="64" y="260" fill="#263b55" font-size="14">Sequence 01 · F1</text>
    <rect x="64" y="274" width="286" height="18" rx="9" fill="#e8edf4"/>
    <rect x="64" y="274" width="284" height="18" rx="9" fill="#2878b5"/>
    <text x="350" y="289" fill="#163b66" font-size="14" font-weight="700" text-anchor="end">0.99308</text>
    <text x="64" y="324" fill="#263b55" font-size="14">Sequence 02 · F1</text>
    <rect x="64" y="338" width="286" height="18" rx="9" fill="#e8edf4"/>
    <rect x="64" y="338" width="284" height="18" rx="9" fill="#2878b5"/>
    <text x="350" y="353" fill="#163b66" font-size="14" font-weight="700" text-anchor="end">0.99149</text>
    <rect x="64" y="398" width="312" height="92" rx="12" fill="#edf5fb"/>
    <text x="80" y="427" fill="#245477" font-size="13" font-weight="700">What this supports</text>
    <text x="80" y="451" fill="#40556d" font-size="13">Temporal association with reference</text>
    <text x="80" y="472" fill="#40556d" font-size="13">geometry; not end-to-end segmentation.</text>
    <text x="64" y="574" fill="#627287" font-size="12">Custom association metric, not an official</text>
    <text x="64" y="594" fill="#627287" font-size="12">Cell Tracking Challenge leaderboard score.</text>

    <rect x="422" y="128" width="356" height="510" rx="18" fill="#ffffff" stroke="#d9e1ec"/>
    <text x="444" y="166" fill="#163b66" font-size="18" font-weight="700">Supervised image-derived holdout</text>
    <text x="444" y="192" fill="#66768a" font-size="13">Fit on sequence 01, test sequence 02,</text>
    <text x="444" y="210" fill="#66768a" font-size="13">then reverse; raw-image pipeline.</text>
    <text x="444" y="260" fill="#263b55" font-size="14">Instance segmentation · F1</text>
    <rect x="444" y="274" width="286" height="18" rx="9" fill="#e8edf4"/>
    <rect x="444" y="274" width="26" height="18" rx="9" fill="#d18b32"/>
    <text x="730" y="289" fill="#8a5b1d" font-size="14" font-weight="700" text-anchor="end">0.09155</text>
    <text x="444" y="324" fill="#263b55" font-size="14">Image-derived detection · F1</text>
    <rect x="444" y="338" width="286" height="18" rx="9" fill="#e8edf4"/>
    <rect x="444" y="338" width="108" height="18" rx="9" fill="#d18b32"/>
    <text x="730" y="353" fill="#8a5b1d" font-size="14" font-weight="700" text-anchor="end">0.37728</text>
    <text x="444" y="388" fill="#263b55" font-size="14">Temporal links · F1</text>
    <rect x="444" y="402" width="286" height="18" rx="9" fill="#e8edf4"/>
    <rect x="444" y="402" width="28" height="18" rx="9" fill="#d18b32"/>
    <text x="730" y="417" fill="#8a5b1d" font-size="14" font-weight="700" text-anchor="end">0.09716</text>
    <rect x="444" y="458" width="312" height="72" rx="12" fill="#fff6e9"/>
    <text x="460" y="487" fill="#8a5b1d" font-size="13" font-weight="700">Negative diagnostic baseline</text>
    <text x="460" y="510" fill="#6b5840" font-size="13">Current supervised segmenter is weak.</text>
    <text x="444" y="574" fill="#627287" font-size="12">Scores show the raw-image-to-tracking</text>
    <text x="444" y="594" fill="#627287" font-size="12">gap; they are not biological phenotype scores.</text>

    <rect x="802" y="128" width="356" height="510" rx="18" fill="#ffffff" stroke="#d9e1ec"/>
    <text x="824" y="166" fill="#163b66" font-size="18" font-weight="700">Cellpose-SAM exploratory pilot</text>
    <text x="824" y="192" fill="#66768a" font-size="13">First 4 frames per sequence · 8 total;</text>
    <text x="824" y="210" fill="#66768a" font-size="13">early-frame sample only.</text>
    <text x="824" y="260" fill="#263b55" font-size="14">Instance segmentation · F1</text>
    <rect x="824" y="274" width="286" height="18" rx="9" fill="#e8edf4"/>
    <rect x="824" y="274" width="250" height="18" rx="9" fill="#25856e"/>
    <text x="1110" y="289" fill="#1c6655" font-size="14" font-weight="700" text-anchor="end">0.87490</text>
    <text x="824" y="324" fill="#263b55" font-size="14">Image-derived detection · F1</text>
    <rect x="824" y="338" width="286" height="18" rx="9" fill="#e8edf4"/>
    <rect x="824" y="338" width="254" height="18" rx="9" fill="#25856e"/>
    <text x="1110" y="353" fill="#1c6655" font-size="14" font-weight="700" text-anchor="end">0.88810</text>
    <text x="824" y="388" fill="#263b55" font-size="14">Temporal links · F1</text>
    <rect x="824" y="402" width="286" height="18" rx="9" fill="#e8edf4"/>
    <rect x="824" y="402" width="255" height="18" rx="9" fill="#25856e"/>
    <text x="1110" y="417" fill="#1c6655" font-size="14" font-weight="700" text-anchor="end">0.89180</text>
    <rect x="824" y="458" width="312" height="72" rx="12" fill="#eaf6f2"/>
    <text x="840" y="487" fill="#1c6655" font-size="13" font-weight="700">Promising, still exploratory</text>
    <text x="840" y="510" fill="#45685f" font-size="13">Not a stable generalization estimate.</text>
    <text x="824" y="574" fill="#627287" font-size="12">Does not establish biological phenotype</text>
    <text x="824" y="594" fill="#627287" font-size="12">validity or transfer to organ-on-a-chip.</text>
  </g>

  <text x="52" y="686" fill="#344b65" font-family="Arial, sans-serif" font-size="14" font-weight="700">Interpretation:</text>
  <text x="152" y="686" fill="#52647a" font-family="Arial, sans-serif" font-size="14">each panel answers a different question; values are not directly comparable across protocols.</text>
  <text x="52" y="718" fill="#748398" font-family="Arial, sans-serif" font-size="12">Source: docs/RESULTS.md · DIC-C2DH-HeLa · all F1 values retained at reported precision</text>
</svg>
