name: CTC Centroid Error Bounds

on:
  push:
    branches: [evidence/ctc-centroid-error-bounds-20261010]
    paths:
      - scripts/audit_ctc_centroid_error_bounds.py
      - tests/test_ctc_centroid_error_bounds.py
      - .github/workflows/ctc-centroid-error-bounds.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - name: Check conservative geometry and 126 real profiles
        run: |
          python -m pytest -q tests/test_ctc_centroid_error_bounds.py
      - name: Write reproducible hypothetical-error sensitivity audit
        run: |
          python scripts/audit_ctc_centroid_error_bounds.py --output ctc_centroid_error_bounds.json
      - uses: actions/upload-artifact@v4
        with:
          name: ctc-centroid-error-geometry-bounds
          path: ctc_centroid_error_bounds.json
