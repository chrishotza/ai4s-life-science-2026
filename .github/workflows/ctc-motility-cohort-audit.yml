name: CTC Cell Motility Cohort Evidence

on:
  push:
    branches:
      - evidence/ctc-motility-cohort-sensitivity-20261010
    paths:
      - scripts/audit_ctc_motility_cohort.py
      - tests/test_ctc_motility_cohort_audit.py
      - .github/workflows/ctc-motility-cohort-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - name: Test cohort audit invariants
        run: python -m pytest -q tests/test_ctc_motility_cohort_audit.py
      - name: Analyze complete 126-profile exported CTC cohort
        run: |
          python scripts/audit_ctc_motility_cohort.py \
            --output /tmp/ctc_motility_cohort_audit.json
          cp /tmp/ctc_motility_cohort_audit.json ./ctc_motility_cohort_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-ctc-cell-motility-cohort-audit
          path: ctc_motility_cohort_audit.json
