name: ALFI oracle detections tracking F1

on:
  push:
    paths:
      - ".github/workflows/alfi-oracle-tracking.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alfi-tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project, tests and selective ALFI download
        run: |
          python -m pip install -e . -r requirements-dev.txt
          python -m pip install remotezip requests
      - name: Verify oracle edge linking on synthetic tracks
        run: python -m pytest -q tests/test_alfi_oracle_tracking.py
      - name: Extract eight actual ALFI DTLTruth source tables
        run: |
          python -u - <<'PY'
          import hashlib,json
          from pathlib import Path
          from remotezip import RemoteZip
          url="https://ndownloader.figshare.com/files/41740227"
          root=Path("external_biology/alfi_oracle_tracking/labels")
          root.mkdir(parents=True,exist_ok=True)
          sha={}
          with RemoteZip(url,support_suffix_range=True,timeout=55) as archive:
              for i in range(1,9):
                  seq=f"MI{i:02d}"
                  path=f"Data&Annotations/{seq}/{seq}_DTLTruth.csv"
                  content=archive.read(path)
                  if not content.startswith(b"ImNo,ID,Class,"):
                      raise ValueError("Invalid DTLTruth "+path)
                  (root/f"{seq}_DTLTruth.csv").write_bytes(content)
                  sha[seq]=hashlib.sha256(content).hexdigest()
                  print(seq,len(content),flush=True)
          (root.parent/"sources.json").write_text(
              json.dumps({"source":url,"license":"CC BY","sha256":sha},indent=2)
          )
          PY
      - name: Compute real sequence oracle-tracking links
        run: |
          python -u -m scripts.benchmark_alfi_oracle_tracking \
            --annotations external_biology/alfi_oracle_tracking/labels \
            --output external_biology/alfi_oracle_tracking/summary.json
      - name: Preserve linked-cell identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfi-eight-expert-sequences-tracking-link-evidence
          path: |
            external_biology/alfi_oracle_tracking/sources.json
            external_biology/alfi_oracle_tracking/summary.json
            external_biology/alfi_oracle_tracking/labels/*.csv
          if-no-files-found: warn
          retention-days: 30
