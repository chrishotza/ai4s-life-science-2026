name: CTC Temporal Holdout Scientific Validation

on:
  pull_request:
    paths:
      - ".github/workflows/ctc-temporal-holdout-validation.yml"
      - "scripts/benchmark_ctc_temporal_holdout.py"
      - "scripts/benchmark_ctc_tra_supervised.py"
      - "scripts/benchmark_ctc_image_e2e.py"
      - "src/ai4s_imaging/supervised.py"
      - "src/ai4s_io/**"
      - "src/ai4s_tracking/**"
      - "src/ai4s_core/**"
  workflow_dispatch:

concurrency:
  group: ctc-temporal-holdout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Cache public microscopy dataset
        uses: actions/cache@v4
        with:
          path: .benchmark_cache
          key: ctc-dic-c2dh-hela-v1-${{ runner.os }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Run strict non-overlapping temporal holdout
        run: python scripts/benchmark_ctc_temporal_holdout.py
      - name: Upload scientific evidence even if quality gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctc-temporal-holdout-evidence
          path: ctc_temporal_holdout_results.json
          if-no-files-found: warn
