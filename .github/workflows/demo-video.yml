name: Demo Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache CTC dataset
        uses: actions/cache@v4
        with:
          path: .benchmark_cache
          key: ctc-dic-c2dh-hela-v1-${{ runner.os }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Render demo
        run: python scripts/make_demo_video.py
      - uses: actions/upload-artifact@v4
        with:
          name: ai4s-demo-video
          path: |
            ai4s_demo_video.mp4
            ai4s_demo_video_metrics.json
