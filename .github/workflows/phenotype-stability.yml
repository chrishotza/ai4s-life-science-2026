name: Phenotype Stability

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/benchmark_phenotype_stability.py"
      - "src/ai4s_phenotype/**"

jobs:
  stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Run stability benchmark
        run: python scripts/benchmark_phenotype_stability.py
      - uses: actions/upload-artifact@v4
        with:
          name: phenotype-stability-results
          path: phenotype_stability_results.json
