name: ALFI Cellpose scale and polarity diagnosis

on:
  push:
    paths:
      - ".github/workflows/alfi-cellpose-scale.yml"
      - "scripts/benchmark_alfi_scale_polarity.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  microscopy-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        variant: [native, native-invert, half-invert]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reproducible CellposeSAM CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install fastremap roifile fill-voids segment_anything opencv-python-headless natsort tqdm remotezip requests
          python -m pip install --no-deps "cellpose==4.2.1.1"
      - name: Download fixed MI05-MI08 T1 original 16-bit images and expert masks
        run: |
          python -u - <<'PY'
          from remotezip import RemoteZip
          from pathlib import Path
          import json,hashlib

          url="https://ndownloader.figshare.com/files/41740227"
          root=Path("external_biology/alfi_scale/input")
          root.mkdir(exist_ok=True,parents=True)
          manifest=[]
          with RemoteZip(url,support_suffix_range=True,timeout=55) as z:
              for seq in ("MI05","MI06","MI07","MI08"):
                  for kind,folder,prefix in (("image","Images","I"),("mask","Masks","M")):
                      name=f"Data&Annotations/{seq}/{folder}/{prefix}_{seq}_0001.png"
                      content=z.read(name)
                      (root/f"{seq}_{kind}_0001.png").write_bytes(content)
                      manifest.append(dict(source=name,bytes=len(content),
                          sha256=hashlib.sha256(content).hexdigest()))
                      print(name,len(content),flush=True)
          (root.parent/"manifest.json").write_text(json.dumps(manifest,indent=2))
          PY
      - name: Evaluate native-resolution and microscopy contrast variant
        run: |
          python -u -m scripts.benchmark_alfi_scale_polarity \
            --inputs external_biology/alfi_scale/input \
            --out external_biology/alfi_scale/results \
            --variant "${{ matrix.variant }}"
      - name: Preserve all evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfi-scale-polarity-${{ matrix.variant }}
          path: |
            external_biology/alfi_scale/manifest.json
            external_biology/alfi_scale/results/
          if-no-files-found: warn
          retention-days: 30
