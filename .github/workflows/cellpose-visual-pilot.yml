name: Cellpose Visual Pilot (real predictions)

on:
  push:
    branches:
      - 'video/**'
    paths:
      - '.github/workflows/cellpose-visual-pilot.yml'
      - 'scripts/export_cellpose_visual_pilot.py'
  workflow_dispatch:

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .benchmark_cache
          key: ctc-dic-c2dh-hela-v1-${{ runner.os }}
      - name: Install baseline pipeline and Cellpose (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install fastremap roifile fill-voids segment_anything opencv-python-headless natsort tqdm
          pip install --no-deps 'cellpose==4.2.1.1'
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Export authentic predicted instance masks and linked tracks
        env:
          AI4S_VISUAL_FRAMES: '8'
          AI4S_VISUAL_SEQUENCE: '01'
        run: python scripts/export_cellpose_visual_pilot.py
      - name: Render compact original Cellpose demonstration
        run: |
          ffmpeg -y -loglevel error -framerate 3 -i cellpose_visual_pilot/pilot_%03d.png -c:v libx264 -pix_fmt yuv420p -movflags +faststart cellpose_visual_pilot.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cellpose-real-prediction-pilot
          path: |
            cellpose_visual_pilot/
            cellpose_visual_pilot.mp4
          if-no-files-found: warn
