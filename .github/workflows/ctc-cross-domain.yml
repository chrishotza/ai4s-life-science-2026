name: CTC Cross-Domain Association Validation

on:
  pull_request:
    paths:
      - ".github/workflows/ctc-cross-domain.yml"
      - "scripts/benchmark_ctc_phc_psc_association.py"
      - "src/ai4s_io/**"
      - "src/ai4s_tracking/**"
      - "requirements.txt"
      - "pyproject.toml"
  push:
    paths:
      - ".github/workflows/ctc-cross-domain.yml"
      - "scripts/benchmark_ctc_phc_psc_association.py"
      - "src/ai4s_io/**"
      - "src/ai4s_tracking/**"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: ctc-cross-domain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache CTC datasets
        uses: actions/cache@v4
        with:
          path: .benchmark_cache
          key: ctc-phc-c2dl-psc-v1
      - name: Install locked runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock-py311.txt
          pip install -e .
      - name: Run cross-domain association benchmark
        run: python scripts/benchmark_ctc_phc_psc_association.py
      - name: Upload cross-domain evidence
        uses: actions/upload-artifact@v4
        with:
          name: ctc-phc-psc-association-evidence
          path: |
            ctc_phc_psc_association_results.json
            ctc_phc_psc_association_summary.csv
