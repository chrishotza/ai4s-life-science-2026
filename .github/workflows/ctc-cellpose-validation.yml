name: CTC Cellpose End-to-End Validation

on:
  pull_request:
    paths:
      - ".github/workflows/ctc-cellpose-validation.yml"
      - "scripts/benchmark_ctc_cellpose.py"
      - "src/ai4s_imaging/cellpose_backend.py"
      - "src/ai4s_imaging/__init__.py"
      - "scripts/benchmark_ctc_tra_supervised.py"
      - "scripts/benchmark_ctc_image_e2e.py"
      - "src/ai4s_tracking/**"
      - "src/ai4s_io/**"
      - "pyproject.toml"
      - "requirements.txt"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ctc-cellpose-validation.yml"
      - "scripts/benchmark_ctc_cellpose.py"
      - "src/ai4s_imaging/cellpose_backend.py"
      - "src/ai4s_imaging/__init__.py"
      - "scripts/benchmark_ctc_tra_supervised.py"
      - "scripts/benchmark_ctc_image_e2e.py"
      - "src/ai4s_tracking/**"
      - "src/ai4s_io/**"
      - "pyproject.toml"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Cache public microscopy dataset
        uses: actions/cache@v4
        with:
          path: .benchmark_cache
          key: ctc-dic-c2dh-hela-v1-${{ runner.os }}
      - name: Install project and CPU-only Cellpose dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install fastremap roifile fill-voids segment_anything opencv-python-headless natsort tqdm
          pip install --no-deps "cellpose==4.2.1.1"
      - name: Evaluate pretrained Cellpose on raw CTC images
        run: python scripts/benchmark_ctc_cellpose.py
      - name: Upload quantitative evidence
        uses: actions/upload-artifact@v4
        with:
          name: ctc-cellpose-e2e-evidence
          path: ctc_cellpose_e2e_results.json
