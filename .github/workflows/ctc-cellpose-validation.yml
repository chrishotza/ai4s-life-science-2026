name: CTC Cellpose End-to-End Validation

on:
  workflow_dispatch:
    inputs:
      max_test_frames:
        description: "Frames per sequence: 4 for a bounded pilot, 40 for the full benchmark"
        required: true
        default: "4"
        type: choice
        options:
          - "4"
          - "40"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # The CPU benchmark is intentionally manual: the full two-sequence run is costly.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Cache public microscopy dataset
        uses: actions/cache@v4
        with:
          path: .benchmark_cache
          key: ctc-dic-c2dh-hela-v1-${{ runner.os }}
      - name: Install project and CPU-only Cellpose dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install fastremap roifile fill-voids segment_anything opencv-python-headless natsort tqdm
          pip install --no-deps "cellpose==4.2.1.1"
      - name: Evaluate pretrained Cellpose on raw CTC images
        env:
          AI4S_CTC_MAX_TEST_FRAMES: ${{ inputs.max_test_frames || '4' }}
        run: python scripts/benchmark_ctc_cellpose.py
      - name: Upload quantitative evidence, including partial checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctc-cellpose-e2e-evidence
          path: ctc_cellpose_e2e_results.json
          if-no-files-found: warn
