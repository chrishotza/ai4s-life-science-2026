name: CTC Cellpose End-to-End Validation

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ctc-cellpose-validation.yml"
      - "scripts/benchmark_ctc_cellpose.py"
      - "src/ai4s_imaging/cellpose_backend.py"
      - "src/ai4s_pipeline/**"
      - "src/ai4s_tracking/**"
      - "src/ai4s_phenotype/**"
      - "requirements-dev.txt"
      - "requirements-lock-py311.txt"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      max_test_frames:
        description: "Frames per sequence: 4/40 for pilots, 84 for both complete sequences"
        required: true
        default: "84"
        type: choice
        options:
          - "4"
          - "40"
          - "84"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # Full run evaluates all 84 frames in both sequences and writes frame-level checkpoints.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Cache public microscopy dataset
        uses: actions/cache@v4
        with:
          path: .benchmark_cache
          key: ctc-dic-c2dh-hela-v1-${{ runner.os }}
      - name: Install project and CPU-only Cellpose dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install fastremap roifile fill-voids segment_anything opencv-python-headless natsort tqdm
          pip install --no-deps "cellpose==4.2.1.1"
      - name: Evaluate pretrained Cellpose on raw CTC images
        env:
          AI4S_CTC_MAX_TEST_FRAMES: ${{ inputs.max_test_frames || '84' }}
        run: python scripts/benchmark_ctc_cellpose.py
      - name: Capture validation provenance
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path

          paths = {
              "results": Path("ctc_cellpose_e2e_results.json"),
              "sequence_01_phenotypes": Path("ctc_cellpose_phenotypes_seq01.csv"),
              "sequence_02_phenotypes": Path("ctc_cellpose_phenotypes_seq02.csv"),
              "benchmark_script": Path("scripts/benchmark_ctc_cellpose.py"),
              "cellpose_backend": Path("src/ai4s_imaging/cellpose_backend.py"),
              "pipeline_engine": Path("src/ai4s_pipeline/engine.py"),
              "tracker": Path("src/ai4s_tracking/tracker.py"),
              "phenotype_extractor": Path("src/ai4s_phenotype/phenotype.py"),
          }
          record = {
              "benchmark": "CTC Cellpose raw-image-to-phenotype bounded/full validation",
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "python_version": platform.python_version(),
              "sha256": {
                  name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for name, path in paths.items()
                  if path.exists()
              },
          }
          Path("ctc_cellpose_e2e_provenance.json").write_text(
              json.dumps(record, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(record, indent=2))
          PY
      - name: Upload quantitative evidence, including partial checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctc-cellpose-e2e-evidence
          path: |
            ctc_cellpose_e2e_results.json
            ctc_cellpose_phenotypes_seq*.csv
            ctc_cellpose_e2e_provenance.json
          if-no-files-found: warn
