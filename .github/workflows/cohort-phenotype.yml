name: Cohort Phenotype Effect Benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/cohort-phenotype.yml"
      - "scripts/benchmark_cohort_effect.py"
      - "src/ai4s_phenotype/**"
      - "tests/test_cohort.py"
      - "requirements.txt"
      - "pyproject.toml"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cohort-phenotype.yml"
      - "scripts/benchmark_cohort_effect.py"
      - "src/ai4s_phenotype/**"
      - "tests/test_cohort.py"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run cohort effect benchmark
        run: python scripts/benchmark_cohort_effect.py
      - name: Upload cohort effect evidence
        uses: actions/upload-artifact@v4
        with:
          name: cohort-phenotype-effect-evidence
          path: cohort_effect_results.json
