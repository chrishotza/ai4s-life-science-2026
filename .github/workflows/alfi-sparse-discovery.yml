name: ALFI sparse annotation discovery

on:
  push:
    paths:
      - ".github/workflows/alfi-sparse-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install remote range reader
        run: python -m pip install remotezip requests
      - name: Query ALFI 8.4 GB archive CENTRAL DIRECTORY only
        run: |
          mkdir -p external_biology/alfi_discovery
          python - <<'PY'
          import json
          from pathlib import Path
          from remotezip import RemoteZip

          u="https://ndownloader.figshare.com/files/41740227"
          target=Path("external_biology/alfi_discovery/probe.json")
          result={"source":"ALFI dataset (final), figshare 23798451",
                  "archive_url":u,"expected_full_archive_bytes":8423073056,
                  "mode":"http-range-central-directory-only",
                  "max_download_bytes_intended":"metadata and central directory, not archive contents"}
          try:
              with RemoteZip(u, support_suffix_range=True, timeout=40) as z:
                  entries=z.infolist()
                  from collections import Counter
                  exts=Counter((i.filename.rsplit(".",1)[-1].lower() if "." in
                                i.filename.rsplit("/",1)[-1] else "(dir/noext)")
                               for i in entries if not i.is_dir())
                  file_types=(".xml",".csv",".json",".txt",".mat",".tsv",".xlsx")
                  ann=[dict(path=i.filename,uncompressed_bytes=i.file_size,
                            compressed_bytes=i.compress_size)
                       for i in entries
                       if not i.is_dir() and
                       (i.filename.lower().endswith(file_types) or
                       "/annotations/" in i.filename.lower() or
                       "/tracks/" in i.filename.lower())]
                  result.update(status="success",n_archive_entries=len(entries),
                                extension_counts=dict(exts),
                                n_nonimage_annotation_candidates=len(ann),
                                annotation_candidates=sorted(ann,key=lambda x:x["uncompressed_bytes"])[:150],
                                largest_candidates=sorted(ann,key=lambda x:x["uncompressed_bytes"],reverse=True)[:30],
                                warning="ZIP metadata only; no validation or full transfer")
                  selected=[
                      i for i in entries
                      if i.filename.startswith("Data&Annotations/")
                      and i.filename.lower().endswith(".csv")
                      and "/._" not in i.filename
                      and i.file_size < 300000
                  ]
                  filesdir=Path("external_biology/alfi_discovery/labels")
                  filesdir.mkdir(parents=True, exist_ok=True)
                  extracted=[]
                  failures=[]
                  for info in selected:
                      try:
                          raw=z.read(info.filename)
                          label_file=filesdir / info.filename.rsplit("/",1)[-1]
                          label_file.write_bytes(raw)
                          extracted.append(dict(source_path=info.filename,
                                                filename=label_file.name,
                                                bytes=len(raw)))
                          print("EXTRACTED",label_file.name,len(raw),flush=True)
                      except Exception as e:
                          failures.append(dict(path=info.filename,
                                               message=str(e)[:250]))
                          print("SKIPPED",info.filename,str(e)[:250],flush=True)
                  result["extraction"]=dict(selected=len(selected),
                                             extracted=extracted,failed=failures)
          except Exception as e:
              result.update(status="range_access_failed",
                            exception_type=type(e).__name__,
                            message=str(e)[:1000])
          target.write_text(json.dumps(result,indent=2),encoding="utf-8")
          print(json.dumps({k:v for k,v in result.items() if k!="annotation_candidates"},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alfi-remote-zip-annotation-manifest
          path: |
            external_biology/alfi_discovery/probe.json
            external_biology/alfi_discovery/labels/*.csv
          if-no-files-found: error
