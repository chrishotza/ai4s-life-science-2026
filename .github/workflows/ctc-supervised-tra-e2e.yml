name: CTC Supervised TRA-to-Phenotype Validation

on:
  pull_request:
    paths:
      - ".github/workflows/ctc-supervised-tra-e2e.yml"
      - "scripts/benchmark_ctc_tra_supervised.py"
      - "src/ai4s_imaging/**"
      - "src/ai4s_tracking/**"
      - "src/ai4s_pipeline/**"
      - "src/ai4s_phenotype/**"
      - "src/ai4s_io/**"
      - "requirements.txt"
      - "pyproject.toml"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ctc-supervised-tra-e2e.yml"
      - "scripts/benchmark_ctc_tra_supervised.py"
      - "src/ai4s_imaging/**"
      - "src/ai4s_tracking/**"
      - "src/ai4s_pipeline/**"
      - "src/ai4s_phenotype/**"
      - "src/ai4s_io/**"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Cache public microscopy dataset
        uses: actions/cache@v4
        with:
          path: .benchmark_cache
          key: ctc-dic-c2dh-hela-v1-${{ runner.os }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Run strict cross-sequence raw-image-to-tracking benchmark
        run: python scripts/benchmark_ctc_tra_supervised.py
      - name: Upload end-to-end evidence
        uses: actions/upload-artifact@v4
        with:
          name: ctc-supervised-tra-e2e-evidence
          path: ctc_supervised_tra_e2e_results.json
