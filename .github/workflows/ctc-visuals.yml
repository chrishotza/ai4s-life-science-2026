name: CTC Visual Evidence

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ctc-visuals.yml"
      - "scripts/make_ctc_figure.py"
      - "src/ai4s_io/**"
      - "src/ai4s_tracking/**"
      - "requirements.txt"
      - "pyproject.toml"

jobs:
  visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Render trajectory comparison
        run: python scripts/make_ctc_figure.py

      - name: Publish figure
        uses: actions/upload-artifact@v4
        with:
          name: ctc-trajectory-comparison
          path: ctc_trajectory_comparison.png
