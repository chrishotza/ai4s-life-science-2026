name: Real CTC phenotype-cluster stability and durable evidence

on:
  push:
    paths:
      - ".github/workflows/ctc-real-phenotype-stability.yml"
      - "scripts/benchmark_ctc_real_phenotype_stability.py"
      - "tests/test_ctc_real_phenotype_stability.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  audit-real-phenotypes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the actual phenotype discovery engine and tests
        run: |
          python -m pip install -e . -r requirements-dev.txt
      - name: Test empirical stability benchmark contract
        run: python -m pytest -q tests/test_ctc_real_phenotype_stability.py
      - name: Download original verified 168-frame Cellpose phenotype artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p external_biology/ctc_original
          gh run download 37930909373 \
            --repo "$GITHUB_REPOSITORY" \
            --name ctc-cellpose-e2e-evidence \
            --dir external_biology/ctc_original
          ls -lh external_biology/ctc_original
      - name: Score real cluster stability across seeds and quality gates
        run: |
          python -u -m scripts.benchmark_ctc_real_phenotype_stability \
            --artifact-directory external_biology/ctc_original \
            --output-dir external_biology/ctc_real_stability \
            --seeds 20 --bootstraps 80
      - name: Persist compact derived feature table and aggregate metrics
        run: |
          mkdir -p docs/evidence/ctc
          cp external_biology/ctc_real_stability/stability_summary.json \
            docs/evidence/ctc/stability_summary.json
          cp external_biology/ctc_real_stability/ctc_derived_phenotype_features.csv \
            docs/evidence/ctc/derived_phenotype_features.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/ctc/stability_summary.json \
            docs/evidence/ctc/derived_phenotype_features.csv
          if ! git diff --cached --quiet; then
            git commit -m "evidence: persist audited real CTC phenotype stability results"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Preserve full reproducibility output and source checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctc-real-phenotype-stability-with-source-hashes
          path: |
            external_biology/ctc_real_stability/
            external_biology/ctc_original/ctc_cellpose_e2e_provenance.json
          if-no-files-found: warn
          retention-days: 90
