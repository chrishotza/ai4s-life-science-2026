name: CTC Supervised Segmentation Validation

on:
  pull_request:
    paths:
      - ".github/workflows/ctc-supervised-segmentation.yml"
      - "scripts/benchmark_ctc_supervised_segmentation.py"
      - "src/ai4s_io/**"
      - "requirements.txt"
      - "pyproject.toml"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ctc-supervised-segmentation.yml"
      - "scripts/benchmark_ctc_supervised_segmentation.py"
      - "src/ai4s_io/**"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache CTC dataset
        uses: actions/cache@v4
        with:
          path: .benchmark_cache
          key: ctc-dic-c2dh-hela-v1-${{ runner.os }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run strict cross-sequence supervised segmentation benchmark
        run: python scripts/benchmark_ctc_supervised_segmentation.py
      - name: Upload supervised segmentation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ctc-supervised-segmentation-evidence
          path: ctc_supervised_segmentation_results.json
