name: PhC-C2DL-PSC Supervised Segmentation Validation

on:
  pull_request:
    paths:
      - ".github/workflows/phc-psc-supervised-segmentation.yml"
      - "scripts/benchmark_phc_psc_supervised_segmentation.py"
      - "scripts/benchmark_ctc_image_e2e.py"
      - "src/ai4s_io/**"
      - "requirements-lock-py311.txt"
      - "pyproject.toml"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/phc-psc-supervised-segmentation.yml"
      - "scripts/benchmark_phc_psc_supervised_segmentation.py"
      - "scripts/benchmark_ctc_image_e2e.py"
      - "src/ai4s_io/**"
      - "requirements-lock-py311.txt"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: phc-psc-supervised-segmentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PSC training dataset
        uses: actions/cache@v4
        with:
          path: .benchmark_cache
          key: ctc-phc-c2dl-psc-v1-${{ runner.os }}
      - name: Install locked runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock-py311.txt
          pip install -e .
      - name: Run strict cross-sequence segmentation benchmark
        run: python scripts/benchmark_phc_psc_supervised_segmentation.py
      - name: Capture validation provenance
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from pathlib import Path

          paths = {
              "results": Path("phc_psc_supervised_segmentation_results.json"),
              "summary": Path("phc_psc_supervised_segmentation_summary.csv"),
              "benchmark_script": Path("scripts/benchmark_phc_psc_supervised_segmentation.py"),
              "segmenter": Path("src/ai4s_imaging/supervised.py"),
          }
          record = {
              "benchmark": "PhC-C2DL-PSC supervised raw-image segmentation, two-way sequence holdout",
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "python_version": platform.python_version(),
              "sha256": {
                  name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for name, path in paths.items()
              },
          }
          Path("phc_psc_supervised_segmentation_provenance.json").write_text(
              json.dumps(record, indent=2) + "\\n",
              encoding="utf-8",
          )
          print(json.dumps(record, indent=2))
          PY
      - name: Upload PSC segmentation evidence
        uses: actions/upload-artifact@v4
        with:
          name: phc-psc-supervised-segmentation-evidence
          path: |
            phc_psc_supervised_segmentation_results.json
            phc_psc_supervised_segmentation_summary.csv
            phc_psc_supervised_segmentation_provenance.json
