name: CTC Real Silver-Reference Centroid Calibration

on:
  push:
    branches:
      - evidence/ctc-centroid-reference-evaluation-20261010
    paths:
      - scripts/evaluate_ctc_mask_centroid_reference.py
      - tests/test_ctc_mask_centroid_reference.py
      - .github/workflows/ctc-centroid-reference-calibration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .benchmark_cache
          key: ctc-dic-c2dh-hela-v1-${{ runner.os }}
      - name: Install project and pretrained CPU segmentation backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install fastremap roifile fill-voids segment_anything opencv-python-headless natsort tqdm
          pip install --no-deps 'cellpose==4.2.1.1'
      - name: Test matching, spatial units and reference coverage
        run: python -m pytest -q tests/test_ctc_mask_centroid_reference.py
      - name: Compare Cellpose mask centers against silver reference masks on both CTC sequences
        run: |
          python scripts/evaluate_ctc_mask_centroid_reference.py \
            --frames-per-sequence 8 \
            --output ctc_centroid_reference_results.json \
            --matches-csv ctc_centroid_reference_matches.csv
      - name: Verify report provenance and bounded claims
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.loads(Path("ctc_centroid_reference_results.json").read_text())
          assert r["status"]=="EMPIRICAL_OFFSET_TO_CTC_SILVER_SEGMENTATION_CENTROID"
          assert r["experiment"]["total_sampled_frames"]==16
          assert len(r["experiment"]["sampled_frame_ids"]["01"])==8
          assert len(r["experiment"]["sampled_frame_ids"]["02"])==8
          assert r["pooled"]["matched_instances"]>0
          digest=hashlib.sha256(Path("ctc_centroid_reference_matches.csv").read_bytes()).hexdigest()
          assert digest==r["experiment"]["per_match_csv_sha256"]
          assert any("NOT provide" in x for x in r["limitations"])
          print("VERIFIED EMPIRICAL OFFSETS:",r["pooled"]["centroid_offset_um"])
          print("SOURCE CSV SHA256:",digest)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctc-real-silver-centroid-offsets-16-frames
          path: |
            ctc_centroid_reference_results.json
            ctc_centroid_reference_matches.csv
          if-no-files-found: warn
