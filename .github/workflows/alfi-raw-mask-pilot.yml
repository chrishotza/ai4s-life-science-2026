name: ALFI raw images multi-sequence generalization

on:
  push:
    paths:
      - ".github/workflows/alfi-raw-mask-pilot.yml"
      - "scripts/evaluate_alfi_raw_mi.py"
      - "tests/test_alfi_raw_mi.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alfi-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTTP range and image reader
        run: |
          python -m pip install -e .
          python -m pip install remotezip requests pytest
          python -m pytest -q tests/test_alfi_raw_mi.py
      - name: Extract 4 MI sequences with original expert masks by HTTP range
        run: |
          python -u - <<'PY'
          import hashlib,io,json
          from pathlib import Path
          import numpy as np
          from PIL import Image
          from remotezip import RemoteZip
          output=Path("external_biology/alfi_raw_pilot")
          output.mkdir(parents=True,exist_ok=True)
          url="https://ndownloader.figshare.com/files/41740227"
          meta=[]
          with RemoteZip(url,support_suffix_range=True,timeout=55) as archive:
              indexed={f.filename:f for f in archive.infolist()}
              for seq in ("MI01","MI02","MI03","MI04"):
                  for t in (1,5,9,13):
                      for kind,dirname,prefix in (("image","Images","I"),("mask","Masks","M")):
                          name=f"Data&Annotations/{seq}/{dirname}/{prefix}_{seq}_{t:04d}.png"
                          if name not in indexed: raise ValueError("Archive missing "+name)
                          raw=archive.read(name)
                          img=Image.open(io.BytesIO(raw))
                          a=np.asarray(img)
                          target=output/f"{seq}_{kind}_{t:04d}.png"
                          target.write_bytes(raw)
                          vals,counts=np.unique(a,return_counts=True)
                          entry=dict(sequence=seq,kind=kind,frame=t,
                                     path=name,sha256=hashlib.sha256(raw).hexdigest(),
                                     size=len(raw),mode=img.mode,
                                     shape=list(a.shape),dtype=str(a.dtype),
                                     unique_count=len(vals),
                                     first_values=[int(v) for v in vals[:12]],
                                     positive_fraction=float(np.mean(a>0)))
                          meta.append(entry)
                          print(f"{seq} {t} {kind} {len(raw)} bytes; mode={img.mode} shape={a.shape} vals={len(vals)} first={vals[:7]}",flush=True)
          (output/"manifest.json").write_text(json.dumps(meta,indent=2))
          PY
      - name: Train on MI01, compare MI02 development and MI03 MI04 untouched holdouts
        run: |
          python -u -m scripts.evaluate_alfi_raw_mi \
            --inputs external_biology/alfi_raw_pilot \
            --out external_biology/alfi_raw_metrics
      - uses: actions/upload-artifact@v4
        with:
          name: alfi-mi01-to-mi02-mi03-mi04-segmentation-evidence
          path: |
            external_biology/alfi_raw_pilot/manifest.json
            external_biology/alfi_raw_metrics/
            external_biology/alfi_raw_pilot/MI0*_*.png
          retention-days: 30
