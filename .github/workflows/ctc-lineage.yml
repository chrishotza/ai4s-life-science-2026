name: CTC Lineage Validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ctc-lineage.yml"
      - "scripts/benchmark_ctc_lineage.py"
      - "src/ai4s_io/**"
      - "src/ai4s_core/**"
      - "src/ai4s_phenotype/**"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Cache CTC dataset
        uses: actions/cache@v4
        with:
          path: .benchmark_cache
          key: ctc-dic-c2dh-hela-v1-${{ runner.os }}
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run lineage benchmark
        run: python scripts/benchmark_ctc_lineage.py
      - uses: actions/upload-artifact@v4
        with:
          name: ctc-lineage-results
          path: ctc_lineage_results.json
