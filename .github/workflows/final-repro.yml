name: Final Reproducibility

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -q
      - name: Synthetic demo
        run: python demo.py
      - name: Association benchmark
        run: python scripts/benchmark_ctc_association.py
      - name: Phenotype benchmark
        run: python scripts/benchmark_ctc_phenotype.py
