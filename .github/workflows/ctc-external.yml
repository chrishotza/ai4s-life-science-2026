name: CTC External Validation

on:
  pull_request:
    paths:
      - "scripts/export_ctc_reference.py"
      - "scripts/run_ctcmetrics.py"
      - "src/ai4s_io/ctc_reference.py"
      - "requirements-ctc.txt"
      - "docs/CTC_OFFICIAL_VALIDATION.md"
  workflow_dispatch:

jobs:
  ctc-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install project and CTC evaluator
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-ctc.txt
      - name: Export sequence 01
        run: python scripts/export_ctc_reference.py --sequence 01 --distance 8.0 --output ctc_reference_export
      - name: Evaluate sequence 01 TRA/LNK
        run: >-
          python scripts/run_ctcmetrics.py
          --gt .benchmark_cache/dataset/DIC-C2DH-HeLa/01_GT
          --res ctc_reference_export/01
          --sequence 01
          --threads 1
          --lineage-mode oracle-compatible
          --output-json results/ctc_metrics_01.json
          --repository-root .
      - name: Export sequence 02
        run: python scripts/export_ctc_reference.py --sequence 02 --distance 8.0 --output ctc_reference_export
      - name: Evaluate sequence 02 TRA/LNK
        run: >-
          python scripts/run_ctcmetrics.py
          --gt .benchmark_cache/dataset/DIC-C2DH-HeLa/02_GT
          --res ctc_reference_export/02
          --sequence 02
          --threads 1
          --lineage-mode oracle-compatible
          --output-json results/ctc_metrics_02.json
          --repository-root .
      - name: Export sequence 01 without oracle lineage
        run: python scripts/export_ctc_reference.py --sequence 01 --distance 8.0 --lineage-mode none --output ctc_reference_export_no_oracle
      - name: Evaluate sequence 01 TRA/LNK without oracle lineage
        run: >-
          python scripts/run_ctcmetrics.py
          --gt .benchmark_cache/dataset/DIC-C2DH-HeLa/01_GT
          --res ctc_reference_export_no_oracle/01
          --sequence 01
          --threads 1
          --lineage-mode none
          --output-json results/ctc_metrics_01_no_oracle.json
          --repository-root .
      - name: Export sequence 02 without oracle lineage
        run: python scripts/export_ctc_reference.py --sequence 02 --distance 8.0 --lineage-mode none --output ctc_reference_export_no_oracle
      - name: Evaluate sequence 02 TRA/LNK without oracle lineage
        run: >-
          python scripts/run_ctcmetrics.py
          --gt .benchmark_cache/dataset/DIC-C2DH-HeLa/02_GT
          --res ctc_reference_export_no_oracle/02
          --sequence 02
          --threads 1
          --lineage-mode none
          --output-json results/ctc_metrics_02_no_oracle.json
          --repository-root .
      - name: Upload CTC evidence
        uses: actions/upload-artifact@v4
        with:
          name: ctc-tra-lnk-evidence
          path: |
            results/ctc_metrics_01.json
            results/ctc_metrics_02.json
            results/ctc_metrics_01_no_oracle.json
            results/ctc_metrics_02_no_oracle.json
            ctc_reference_export/01/res_track.txt
            ctc_reference_export/02/res_track.txt
            ctc_reference_export_no_oracle/01/res_track.txt
            ctc_reference_export_no_oracle/02/res_track.txt
          if-no-files-found: error
