name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Phenotype stability benchmark
        run: python scripts/benchmark_phenotype_stability.py
      - name: CTC lineage validation
        run: python scripts/benchmark_ctc_lineage.py
      - name: Submission claim audit
        run: python scripts/validate_submission_claims.py
