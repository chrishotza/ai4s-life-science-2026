name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q src scripts demo.py
      - name: Static analysis
        run: ruff check src scripts demo.py
      - run: python -m pip check
      - run: pytest -q
      - name: Phenotype stability benchmark
        run: python scripts/benchmark_phenotype_stability.py
      - name: End-to-end phenotype robustness benchmark
        run: python scripts/benchmark_end_to_end_phenotype.py
      - name: Confidence-gated phenotype artifact
        run: |
          python scripts/generate_confidence_gated_ctc_summary.py \
            --output /tmp/confidence_gated_phenotype_summary.json
          cmp /tmp/confidence_gated_phenotype_summary.json \
            docs/evidence/ctc/confidence_gated_phenotype_summary.json
      - name: Frozen cohort-level CTC motility audit
        run: |
          python scripts/audit_ctc_motility_cohort.py \
            --output /tmp/ctc_motility_cohort_audit.json
          cmp /tmp/ctc_motility_cohort_audit.json \
            docs/evidence/ctc/motility_cohort_sensitivity.json
      - name: Frozen CTC centroid-error sensitivity bounds
        run: |
          python scripts/audit_ctc_centroid_error_bounds.py \
            --output /tmp/ctc_centroid_error_bounds.json
          cmp /tmp/ctc_centroid_error_bounds.json \
            docs/evidence/ctc/centroid_localization_bounds.json
      - name: Independent frozen silver-centroid measurement audit
        run: python scripts/validate_ctc_centroid_reference_evidence.py
      - name: Submission claim audit
        run: python scripts/validate_submission_claims.py
