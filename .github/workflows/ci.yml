name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q src scripts demo.py
      - name: Static analysis
        run: ruff check src scripts demo.py
      - run: python -m pip check
      - run: pytest -q
      - name: Phenotype stability benchmark
        run: python scripts/benchmark_phenotype_stability.py
      - name: End-to-end phenotype robustness benchmark
        run: python scripts/benchmark_end_to_end_phenotype.py
      - name: Submission claim audit
        run: python scripts/validate_submission_claims.py
