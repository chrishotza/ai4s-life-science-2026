[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4s-temporal-phenotype"
version = "0.1.0"
description = "Reproducible temporal single-cell phenotype analysis from microscopy trajectories"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
