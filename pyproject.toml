[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4s-temporal-phenotype"
version = "0.1.0"
description = "Reproducible temporal single-cell phenotype analysis from microscopy trajectories"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "tifffile>=2024.2",
  "imagecodecs>=2024.1",
]

[tool.setuptools.packages.find]
where = ["src"]
